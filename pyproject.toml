[project]
name = "progetto4-contatti"
version = "1.0.0"
description = "Rubrica di contatti su MongoDB — progetto 4 del Master in Data Engineering (ProfessionAI)"
requires-python = ">=3.11"
dependencies = [
    "pymongo==4.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.16",
]

[tool.setuptools]
# Flat modules at repo root, no package directory by design.
py-modules = ["db", "queries", "solution"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus: full pycodestyle, isort, pyupgrade,
# flake8-bugbear, flake8-simplify.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
